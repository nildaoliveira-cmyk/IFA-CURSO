<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarte Correto na Escola</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Descarte Correto na Escola</h1>
    <p>Vamos cuidar juntos do nosso espaço!</p>
  </header>

  <section id="quiz">
    <h2>Quiz da Reciclagem 🌱</h2>
    <div id="question-container">
      <p id="question">Pergunta aparecerá aqui</p>
      <div id="options"></div>
    </div>
    <button id="next-btn">Próxima</button>
    <p id="score"></p>
  </section>

  <footer>
    <p>🌍 Conscientização é o primeiro passo para um futuro sustentável!</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
